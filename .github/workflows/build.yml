name: Build

env:
  MAVEN_MIRROR: ${{ secrets.MAVEN_MIRROR }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  COMMON_MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end -Dno-format"

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.github'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.github'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

jobs:
  check:
    # Check if there are other than .md files changed, if so do run full pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for code changes
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }}
          changes=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Changed files: $changes"
          if echo "$changes" | grep -vE '\.(md)$'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    # `check` only runs for pull_request events (see its `if` above) - it needs a base ref to
    # diff against, which a push doesn't have. On any other trigger (a push to main,
    # workflow_dispatch, ...) `check` is skipped.
    #
    # A previous fix here added `github.event_name != 'pull_request' ||` so the OR would be
    # true on a push regardless of `check`'s (empty, not "false") output. That's necessary but
    # not sufficient: GitHub Actions skips a job by default whenever any of its `needs` jobs
    # was itself skipped, regardless of what the job's own `if` evaluates to - `always()` is
    # required to opt out of that. Without it, `build` kept silently skipping on every push to
    # main, exactly like before, because `check` skips on push and that alone was enough to
    # skip `build` too, before its `if` was ever evaluated. Confirmed via the Actions API on a
    # non-docs push commit: both jobs completed with zero steps run.
    if: always() && (github.event_name != 'pull_request' || needs.check.outputs.code_changed == 'true')
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone) is required so
      # `git diff origin/main...HEAD` in the ratchet step below can resolve origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Artifact
        run: ./mvnw $COMMON_MAVEN_ARGS --file pom.xml verify

      # Baseline PMD/Checkstyle reports for origin/main, used by the ratchet step below to tell
      # a genuinely new violation apart from a pre-existing one that a purely mechanical edit
      # (e.g. adding `final` to a method signature) happened to move into the diff.
      - name: Generate baseline (origin/main) PMD/Checkstyle reports for ratchet
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../ratchet-base origin/main
          (cd ../ratchet-base && ./mvnw $COMMON_MAVEN_ARGS --file pom.xml -DskipTests compile pmd:pmd checkstyle:checkstyle)

      - name: Upload PMD/Checkstyle/CPD reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-checkstyle-reports
          path: |
            **/target/pmd.xml
            **/target/cpd.xml
            **/target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize PMD/Checkstyle/CPD violations
        if: always()
        run: python3 .github/scripts/summarize-static-analysis.py "**/target/pmd.xml" "**/target/checkstyle-result.xml" "**/target/cpd.xml" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail build on new PMD/Checkstyle violations (ratchet)
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/check-new-violations.py origin/main \
            "**/target/pmd.xml" "**/target/checkstyle-result.xml" \
            "../ratchet-base/**/target/pmd.xml" "../ratchet-base/**/target/checkstyle-result.xml"
