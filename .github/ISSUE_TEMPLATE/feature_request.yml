name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What is the idea?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is it important or useful? Is this related to a problem you're facing? Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What can't you do today that this would let you do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions, features, or workarounds you've considered.
    validations:
      required: false
